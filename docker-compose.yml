name: gestionordinateurs

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: tp6postgres
      POSTGRES_DB: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: tp6postgres
      KC_HOSTNAME: http://localhost:8180
      # L'API Docker lit les cles via keycloak:8080 ; l'issuer reste localhost:8180.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT:-tp6local}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    environment:
      ConnectionStrings__ParcInformatique: Data Source=/app/data/parcinfo.db
      Keycloak__MetadataAddress: http://keycloak:8080/realms/gestionordinateurs/.well-known/openid-configuration
    ports:
      - "5256:5256"
    volumes:
      - ordinateurs_data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT:-tp6local}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    environment:
      ApiUrl: http://gestionordinateurs-api:5256/
    ports:
      - "5011:5011"
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gateway:
    image: ${DOCKER_ACCOUNT:-tp6local}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    environment:
      ReverseProxy__Clusters__metier__Destinations__api__Address: http://gestionordinateurs-api:5256/
      ReverseProxy__Clusters__auth__Destinations__api__Address: http://authentification-api:5011/
    ports:
      - "5010:5010"
    depends_on:
      - gestionordinateurs-api
      - authentification-api
    networks:
      - appnet

  client:
    image: ${DOCKER_ACCOUNT:-tp6local}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - gateway
    networks:
      - appnet

volumes:
  ordinateurs_data:
  postgres_data:

networks:
  appnet:
