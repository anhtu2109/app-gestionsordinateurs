server {
    listen 5000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Les routes Blazor sont resolues dans le navigateur.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Un fichier WebAssembly absent doit retourner 404, pas index.html.
    location /_framework/ {
        try_files $uri =404;
    }
}
